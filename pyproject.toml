[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evolution"
version = "0.1.0"
description = "Evaluate and evolve shared agent skills with reproducible evidence"
requires-python = ">=3.11"
dependencies = ["pydantic==2.12.5", "PyYAML==6.0.3", "typer==0.21.1"]

[project.optional-dependencies]
gepa = ["gepa==0.1.4"]
dev = ["pytest==9.0.3"]

[project.scripts]
agent-evolution = "agent_evolution.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

